name: Extension checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate extension package
        run: node scripts/validate-extension.mjs
      - name: Run regression tests
        run: node --test tests/*.test.cjs
      - name: Build installable extension ZIP
        run: |
          node scripts/package-extension.mjs
          unzip -t dist/LocalPassMass-v*.zip
          if unzip -Z1 dist/LocalPassMass-v*.zip | grep -E '^(scripts|tests|website|docs)/|(^|/)(README|.*\\.pem|.*\\.svault)$'; then
            echo "Non-runtime file found in extension package"
            exit 1
          fi
      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: LocalPassMass-v1.13.0
          path: dist/LocalPassMass-v*.zip
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build release ZIP
        run: node scripts/package-extension.mjs
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json')).version")
          test "$VERSION" = "1.13.0"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            exit 0
          fi
          gh release create "v$VERSION" "dist/LocalPassMass-v$VERSION.zip"             --title "LocalPassMass v$VERSION — Release Candidate"             --notes-file docs/RELEASE_v1.13.0.md             --target "$GITHUB_SHA" --prerelease
