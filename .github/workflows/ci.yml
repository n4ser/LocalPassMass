name: Extension checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate extension package
        run: node scripts/validate-extension.mjs
      - name: Run regression tests
        run: node --test tests/*.test.cjs
      - name: Build installable extension ZIP
        run: |
          node scripts/package-extension.mjs
          unzip -t dist/LocalPassMass-v*.zip
          if unzip -Z1 dist/LocalPassMass-v*.zip | grep -E '^(scripts|tests|website|docs)/|(^|/)(README|.*\\.pem|.*\\.svault)$'; then
            echo "Non-runtime file found in extension package"
            exit 1
          fi
      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: LocalPassMass-v1.12.0
          path: dist/LocalPassMass-v*.zip
          if-no-files-found: error
